# 本地 Mac 测试用 robocasa(mujoco@5001,CPU 可跑,含完整学习);
# 联调 3dgs 时改回 "mujoco_3dgs" 并把该后端 url 指到 GPU 机器 IP:5002
active_backend: "mujoco"  # 本地默认;跑桌面 demo 改 "desk",真机 "dream",3dgs "mujoco_3dgs"

# Robot selection: "xlerobot" (default) or "BlueThink"
robot: "xlerobot"

backends:
  mujoco:
    enabled: 1
    provide_state: 1
    accept_action: 1
    required: 1
    url: "http://127.0.0.1:5001"
    timeout: 120
    launch_hint: "serve/main.py"

  mujoco_3dgs:
    enabled: 1
    provide_state: 1
    accept_action: 1
    required: 1
    url: "http://127.0.0.1:5002"
    timeout: 120
    launch_hint: "serve_3dgs/main.py"

  # 定点桌面 mock 世界(大脑闭环开发,零仿真依赖,含失败注入;serve_desk/main.py)
  desk:
    enabled: 1
    provide_state: 1
    accept_action: 1
    required: 1   # 必须 1:required:0 会让 _merge 吞掉执行失败,大脑看不见 VLA 报错(接真 VLA 同理)
    url: "http://127.0.0.1:5008"
    timeout: 30
    launch_hint: "serve_desk/main.py"

  # 真机:导航建图组(DREAM)适配后端。提供 objects/fixtures/base_status/map_data(读交换
  # 目录 latest 文件)+ /nav(按对方文件契约写任务/收结果);grasp/place/screenshot 返 501,
  # 由 VLA 组后端提供(真机 = dream 管状态与导航 + VLA 管操作,双后端并存)。
  dream:
    enabled: 1
    provide_state: 1
    accept_action: 1
    required: 0
    url: "http://127.0.0.1:5006"
    timeout: 200
    launch_hint: "serve_dream/main.py"

  isaacsim:
    enabled: 0
    provide_state: 0
    accept_action: 0
    required: 0
    url: "http://127.0.0.1:5101"
    timeout: 120

  gazebo:
    enabled: 0
    provide_state: 0
    accept_action: 0
    required: 0
    url: "http://127.0.0.1:5201"
    timeout: 120

  real:
    enabled: 0
    provide_state: 0
    accept_action: 0
    required: 0

navigation:
  # 关掉独立 nav2 服务路由(本地没起 5102 → Connection refused)。关掉后导航回落到当前后端:
  # robocasa 走 serve 内置 /nav(dev 那套 A*+PD),3dgs 走 serve_3dgs /move_to(见 runtime._nav_call)。
  # 若同学的 real2sim 要用独立 nav2 规划服务,把 enabled 改回 1、起 5102 服务即可。
  enabled: 0
  backend: "nav2"
  url: "http://127.0.0.1:5102"
  timeout: 120

# Policy inference services (standalone processes)
policy_services:
  act:
    enabled: 1
    url: "http://127.0.0.1:5003"
    max_steps: 1000   # ACT 抓取主循环迭代上限（replay 轨迹 377 帧，默认 300 走不完）
    # launch_hint: "services/act_server.py --policy-path <checkpoint> --port 5003"
  pi05:
    enabled: 1
    # pi0.5 推理在另一台机器（需 patched transformers + 大显存）。改成那台机器的地址。
    url: "http://127.0.0.1:5005"
    task: "pick up the object and place it"
    # launch_hint: "services/pi05_server.py --policy-path /data/FQIntern/49000/pretrained_model --base-model-path /data/FQIntern/pi05_base --tokenizer-path /data/FQIntern/paligemma_tokenizer --deploy-dir /data/FQIntern --port 5005"
  diffusion_policy:
    enabled: 0
    url: "http://127.0.0.1:5004"
  pi0:
    enabled: 0
    url: "http://127.0.0.1:5005"
